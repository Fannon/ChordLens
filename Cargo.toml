[package]
name = "chord-lens"
version = "0.3.0"
edition = "2021"
authors = ["Simon Heimler"]
license = "MIT"
description = "A real-time MIDI chord detector plugin (VST3/CLAP)"

[workspace]
members = ["xtask"]

[lib]
# cdylib = the plugin shared library; lib = needed for the standalone binary target
crate-type = ["cdylib", "lib"]

[dependencies]
# Core NIH-plug framework pinned to the revision validated by this repo.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "28b149ec4d62757d0b448809148a0c3ca6e09a95", features = [
    "standalone",
] }

# egui GUI integration shipped alongside the same pinned NIH-plug revision
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "28b149ec4d62757d0b448809148a0c3ca6e09a95" }
serde = { version = "1.0", features = ["derive"] }

# Atomic f32 – used for nothing yet but left here for future metering widgets
atomic_float = "0.1"

# parking_lot RwLock is non-allocating on the uncontended fast path, making it
# acceptable to *read* from the audio thread (we only *write* from the audio
# thread and *read* from the GUI thread – never the other way round).
parking_lot = "0.12"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
