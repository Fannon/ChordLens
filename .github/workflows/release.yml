name: Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
            target-path: target/release/chord_lens.dll
            binary-name: ChordLens_Windows
          - os: macos-latest
            os-name: macos
            target-path: target/release/libchord_lens.dylib
            binary-name: ChordLens_macOS
          - os: ubuntu-latest
            os-name: linux
            target-path: target/release/libchord_lens.so
            binary-name: ChordLens_Linux

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libjack-jackd2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Build Release
        run: cargo build --release
        
      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist/ChordLens
          cp "${{ matrix.target-path }}" "dist/ChordLens/ChordLens.vst3"
          cp "${{ matrix.target-path }}" "dist/ChordLens/ChordLens.clap"
          
          # Use different zipping strategy per OS for reliable results
          if [ "${{ matrix.os-name }}" == "windows" ]; then
            # Windows: use powershell to create a proper zip
            powershell Compress-Archive -Path dist/ChordLens -DestinationPath dist/ChordLens_Windows.zip
          else
            # Unix-like: use standard zip
            cd dist
            zip -r "ChordLens_${{ matrix.os-name }}.zip" ChordLens
            cd ..
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os-name }}-zip
          path: dist/*.zip

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: output
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          generate_release_notes: true
          draft: false
          prerelease: false
