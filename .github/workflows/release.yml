name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libjack-jackd2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo test
        run: cargo test

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build (${{ matrix.os-name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
          - os: macos-latest
            os-name: macos
          - os: ubuntu-latest
            os-name: linux

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libjack-jackd2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Bundle Release Artifacts
        run: cargo xtask bundle chord-lens --release

      - name: Install pluginval
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: choco install pluginval -y --no-progress

      - name: Validate VST3 with pluginval
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: pluginval --validate-in-process --strictness-level 5 --output-dir pluginval-logs --validate target\bundled\ChordLens.vst3

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/ChordLens | Out-Null
          Copy-Item -Recurse -Force "target/bundled/ChordLens.vst3" "dist/ChordLens/ChordLens.vst3"
          Copy-Item -Recurse -Force "target/bundled/ChordLens.clap" "dist/ChordLens/ChordLens.clap"
          Compress-Archive -Path dist/ChordLens -DestinationPath "dist/ChordLens_${{ matrix.os-name }}.zip" -Force

      - name: Upload pluginval logs
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-pluginval-logs
          path: pluginval-logs/**
          if-no-files-found: ignore

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os-name }}-zip
          path: dist/*.zip

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: output
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          generate_release_notes: true
          draft: false
          prerelease: false
