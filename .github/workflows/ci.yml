name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libjack-jackd2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo test
        run: cargo test

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build (${{ matrix.os-name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
            target-path: target/release/chord_lens.dll
          - os: macos-latest
            os-name: macos
            target-path: target/release/libchord_lens.dylib
          - os: ubuntu-latest
            os-name: linux
            target-path: target/release/libchord_lens.so

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libjack-jackd2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release
        run: cargo build --release

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist/ChordLens
          cp "${{ matrix.target-path }}" "dist/ChordLens/ChordLens.vst3"
          cp "${{ matrix.target-path }}" "dist/ChordLens/ChordLens.clap"

          if [ "${{ matrix.os-name }}" == "windows" ]; then
            powershell Compress-Archive -Path dist/ChordLens -DestinationPath dist/ChordLens_Windows.zip
          else
            cd dist
            zip -r "ChordLens_${{ matrix.os-name }}.zip" ChordLens
            cd ..
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os-name }}-zip
          path: dist/*.zip
